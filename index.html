<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EbuLa - Digitaler Buchfahrplan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="ebula-device">
    <img src="ebula_frame.png" class="frame-bg" alt="EbuLa Gehäuse">

    <div class="display-container">
      <img src="ebula_screen.png" class="screen-bg" alt="EbuLa Display">

      <div class="display-content">
        <div class="header-row">
          <span id="zug-nr">ICE 574</span>
          <span id="v-max">200 km/h</span>
          <span id="uhrzeit">14:32:00</span>
        </div>

        <div class="timetable">
          <div class="row">
            <div class="col-km">0.0</div>
            <div class="col-station">Frankfurt(Main)Hbf</div>
            <div class="col-time">14:30</div>
          </div>
          <div class="row active">
            <div class="col-km">12.4</div>
            <div class="col-station">Frankfurt Stadion</div>
            <div class="col-time">14:35</div>
          </div>
          <div class="row">
            <div class="col-km">33.8</div>
            <div class="col-station">Rüsselsheim</div>
            <div class="col-time">14:42</div>
          </div>
          <div class="row">
            <div class="col-km">74.2</div>
            <div class="col-station">Mainz Hbf</div>
            <div class="col-time">14:55</div>
          </div>
        </div>

        <div class="footer-row">
          <button class="softkey-btn">Zug</button>
          <span class="status-msg">BEREIT</span>
          <button class="softkey-btn">G</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
