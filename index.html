<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EbuLa - Digitaler Buchfahrplan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="ebula-device">
    <img src="ebula_frame.png" class="frame-bg" alt="EbuLa Gehäuse">

    <div class="display-container">
      <img src="ebula_screen.png" class="screen-bg" alt="EbuLa Display">

      <div class="display-content">
        
        <div class="header-row">
          <span class="box-zug">10901</span>
          <span class="box-status">Fahrplan gültig!</span>
          <span class="box-datum">07.06.2018</span>
          <span class="box-zeit" id="uhrzeit">07:02:59</span>
        </div>

        <div class="timetable">
          <div class="row">
            <span class="col-speed">120</span>
            <span class="col-km">50,5</span>
            <span class="col-station">Herchener Tunnel</span>
          </div>
          <div class="row">
            <span class="col-speed"></span>
            <span class="col-km">50,0</span>
            <span class="col-station">Asig <span class="sig">A60</span></span>
          </div>
          <div class="row">
            <span class="col-speed"></span>
            <span class="col-km">49,8</span>
            <span class="col-station bold">Herchen</span>
            <span class="col-ank">07:03.3</span>
            <span class="col-abf">07:04.0</span>
          </div>
          <div class="row">
            <span class="col-speed">100</span>
            <span class="col-km">43,0</span>
            <span class="col-station bold">Eitorf</span>
            <span class="col-ank">06:58.3</span>
            <span class="col-abf">06:59.0</span>
          </div>
        </div>

        <div class="footer-row">
          <button class="softkey-btn">Zug</button>
          <button class="softkey-btn">FSD</button>
          <button class="softkey-btn">LW</button>
          <button class="softkey-btn">GW</button>
          <button class="softkey-btn">Zeit</button>
          <button class="softkey-btn right-btn">G</button>
        </div>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
