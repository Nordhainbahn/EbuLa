<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EbuLa - Digitaler Buchfahrplan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="ebula-device">
    <img src="ebula_frame.png" class="frame-bg" alt="EbuLa Gehäuse">

    <div class="display-container">
      <img src="ebula_screen.png" class="screen-bg" alt="EbuLa Display">

      <div class="display-content">
        
        <div class="header-row">
          <span class="head-col-1">10901</span>
          <span class="head-col-2">Fahrplan gültig!</span>
          <span class="head-col-3">07.06.2018</span>
          <span class="head-col-4" id="uhrzeit">07:02:59</span>
        </div>

        <div class="sub-header-row">
          <span>ab km 50,4: 80 km/h</span>
          <span>Nächster Halt: Schladern (Sieg)</span>
        </div>

        <div class="timetable">
          <div class="row">
            <div class="col-v">120</div>
            <div class="col-km">50,5</div>
            <div class="col-station">Herchener Tunnel</div>
            <div class="col-ank"></div>
            <div class="col-abf"></div>
          </div>
          
          <div class="row">
            <div class="col-v"></div>
            <div class="col-km">50,0</div>
            <div class="col-station">Asig <span class="sig-code">A60</span></div>
            <div class="col-ank"></div>
            <div class="col-abf"></div>
          </div>
          
          <div class="row">
            <div class="col-v"></div>
            <div class="col-km">49,8</div>
            <div class="col-station station-bold">Herchen</div>
            <div class="col-ank">07:03.3</div>
            <div class="col-abf">07:04.0</div>
          </div>

          <div class="row">
            <div class="col-v">100</div>
            <div class="col-km">43,0</div>
            <div class="col-station station-bold">Eitorf</div>
            <div class="col-ank">06:58.3</div>
            <div class="col-abf">06:59.0</div>
          </div>
        </div>

        <div class="footer-row">
          <div class="softkey-group">
            <button class="softkey-btn">Zug</button>
            <button class="softkey-btn">FSD</button>
            <button class="softkey-btn">LW</button>
            <button class="softkey-btn">GW</button>
            <button class="softkey-btn">Zeit</button>
          </div>
          <button class="softkey-btn">G</button>
        </div>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
