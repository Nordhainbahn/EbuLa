<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EbuLa - Digitaler Buchfahrplan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="ebula-device">
    <img src="ebula_frame.png" class="frame-bg" alt="EbuLa Gehäuse">

    <div class="display-container">
      
      <div class="header-top">
        <div class="box zugnr">10901</div>
        <div class="box status">Fahrplan gültig!</div>
        <div class="box datum" id="datum-field">07.06.2018</div>
        <div class="box uhrzeit" id="uhrzeit-field">07:02:59</div>
      </div>

      <div class="header-sub">
        <div class="sub-left">ab km 50,4: 80 km/h</div>
        <div class="sub-right">Nächster Halt: <span>Schladern (Sieg)</span></div>
      </div>

      <div class="timetable-container">
        
        <div class="ebula-row">
          <div class="col-speed-bar">120</div>
          <div class="col-km">50,5</div>
          <div class="col-symbol"></div>
          <div class="col-station">Herchener Tunnel</div>
          <div class="col-ankunft"></div>
          <div class="col-abfahrt"></div>
        </div>

        <div class="ebula-row">
          <div class="col-speed-bar"></div>
          <div class="col-km">50,0</div>
          <div class="col-symbol">¥</div>
          <div class="col-station">Asig <span class="signal-code">A60</span></div>
          <div class="col-ankunft"></div>
          <div class="col-abfahrt"></div>
        </div>

        <div class="ebula-row active-station">
          <div class="col-speed-bar"></div>
          <div class="col-km">49,8</div>
          <div class="col-symbol"></div>
          <div class="col-station station-bold">Herchen</div>
          <div class="col-ankunft">07:03.3</div>
          <div class="col-abfahrt">07:04.0</div>
        </div>

        <div class="ebula-row">
          <div class="col-speed-bar">100</div>
          <div class="col-km">43,0</div>
          <div class="col-symbol">¥</div>
          <div class="col-station station-bold">Eitorf</div>
          <div class="col-ankunft">06:58.3</div>
          <div class="col-abfahrt">06:59.0</div>
        </div>

      </div>

      <div class="footer-bar">
        <button class="softkey">Zug</button>
        <button class="softkey">FSD</button>
        <button class="softkey">LW</button>
        <button class="softkey">GW</button>
        <button class="softkey">Zeit</button>
        <button class="softkey right-btn">G</button>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
